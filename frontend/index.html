<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Empodérate Vecino — RRHH</title>
  <link rel="icon" href="data:," />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-100 min-h-screen" x-data="app()" x-init="init()">

  <div id="boot-msg" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f1f5f9;z-index:50;padding:1rem;">
    <div style="max-width:460px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;font-family:sans-serif;color:#334155;font-size:14px;">
      <strong>Cargando sistema…</strong>
      <p style="margin:8px 0 0;" id="boot-detail">Si este mensaje no desaparece, abajo aparecerá la causa.</p>
    </div>
  </div>

  <!-- =================== RESTABLECER CONTRASEÑA =================== -->
  <template x-if="ready && showReset">
    <div class="min-h-screen flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">
        <div class="text-center mb-6">
          <img src="assets/logo.png" alt="" class="h-20 mx-auto mb-3" onerror="this.style.display='none'" />
          <h1 class="text-xl font-bold text-slate-800">Nueva contraseña</h1>
          <p class="text-slate-500 mt-1">Crea una contraseña segura para tu cuenta.</p>
        </div>
        <form @submit.prevent="saveNewPassword" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Nueva contraseña</label>
            <input type="password" x-model="newPass" class="w-full px-4 py-2 border border-slate-300 rounded-lg" />
          </div>
          <div class="flex gap-1 mb-2">
            <div class="h-2 flex-1 rounded-full" :class="passwordChecks.length ? 'bg-green-500' : 'bg-slate-200'"></div>
            <div class="h-2 flex-1 rounded-full" :class="passwordChecks.upper ? 'bg-green-500' : 'bg-slate-200'"></div>
            <div class="h-2 flex-1 rounded-full" :class="passwordChecks.lower ? 'bg-green-500' : 'bg-slate-200'"></div>
            <div class="h-2 flex-1 rounded-full" :class="passwordChecks.number ? 'bg-green-500' : 'bg-slate-200'"></div>
            <div class="h-2 flex-1 rounded-full" :class="passwordChecks.special ? 'bg-green-500' : 'bg-slate-200'"></div>
          </div>
          <ul class="text-xs space-y-1">
            <li :class="passwordChecks.length ? 'text-green-600' : 'text-slate-500'"><span x-text="passwordChecks.length ? '✓' : '○'"></span> Mínimo 8 caracteres</li>
            <li :class="passwordChecks.upper ? 'text-green-600' : 'text-slate-500'"><span x-text="passwordChecks.upper ? '✓' : '○'"></span> Una MAYÚSCULA</li>
            <li :class="passwordChecks.lower ? 'text-green-600' : 'text-slate-500'"><span x-text="passwordChecks.lower ? '✓' : '○'"></span> Una minúscula</li>
            <li :class="passwordChecks.number ? 'text-green-600' : 'text-slate-500'"><span x-text="passwordChecks.number ? '✓' : '○'"></span> Un número</li>
            <li :class="passwordChecks.special ? 'text-green-600' : 'text-slate-500'"><span x-text="passwordChecks.special ? '✓' : '○'"></span> Un carácter especial</li>
          </ul>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Confirmar</label>
            <input type="password" x-model="newPass2" class="w-full px-4 py-2 border border-slate-300 rounded-lg" />
            <p class="text-xs mt-1" x-show="newPass2.length > 0" :class="passwordChecks.match ? 'text-green-600' : 'text-red-600'"
               x-text="passwordChecks.match ? '✓ Coinciden' : '✗ No coinciden'"></p>
          </div>
          <div x-show="resetMsg" x-text="resetMsg" class="bg-red-50 text-red-700 text-sm p-3 rounded-lg"></div>
          <button type="submit" :disabled="!isPasswordValid"
            :class="isPasswordValid ? 'bg-blue-600 hover:bg-blue-700' : 'bg-slate-300 cursor-not-allowed'"
            class="w-full text-white py-2 rounded-lg font-medium">Guardar contraseña</button>
        </form>
      </div>
    </div>
  </template>

  <!-- =================== RECUPERAR CONTRASEÑA =================== -->
  <template x-if="ready && !session && !showReset && forgotMode">
    <div class="min-h-screen flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">
        <div class="text-center mb-6">
          <img src="assets/logo.png" alt="" class="h-20 mx-auto mb-3" onerror="this.style.display='none'" />
          <h1 class="text-xl font-bold text-slate-800">Recuperar contraseña</h1>
          <p class="text-slate-500 mt-1">Te enviaremos un enlace para crear una nueva contraseña.</p>
        </div>
        <form @submit.prevent="forgot()" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Correo</label>
            <input type="email" x-model="email" required class="w-full px-4 py-2 border border-slate-300 rounded-lg" />
          </div>
          <div x-show="errorMsg" x-text="errorMsg" class="bg-red-50 text-red-700 text-sm p-3 rounded-lg"></div>
          <button type="submit" :disabled="forgotLoading" class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 disabled:bg-slate-400">
            <span x-text="forgotLoading ? 'Enviando...' : 'Enviar'"></span>
          </button>
          <button type="button" @click="cancelForgot()" class="w-full bg-slate-200 text-slate-700 py-2 rounded-lg font-medium hover:bg-slate-300">Volver al login</button>
        </form>
      </div>
    </div>
  </template>

  <!-- =================== LOGIN =================== -->
  <template x-if="ready && !session && !showReset && !forgotMode">
    <div class="min-h-screen flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">
        <div class="text-center mb-6">
          <img src="assets/logo.png" alt="" class="h-20 mx-auto mb-3" onerror="this.style.display='none'" />
          <h1 class="text-2xl font-bold text-slate-800">Empodérate Vecino</h1>
          <p class="text-slate-500 mt-1">Sistema de Gestión de Voluntariado</p>
        </div>
        <div x-show="configError" x-text="configError" class="bg-amber-50 border border-amber-300 text-amber-800 text-sm p-3 rounded-lg mb-4"></div>
        <form @submit.prevent="login()" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Correo</label>
            <input type="email" x-model="email" required class="w-full px-4 py-2 border border-slate-300 rounded-lg" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
            <input type="password" x-model="password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg" />
          </div>
          <div x-show="errorMsg" x-text="errorMsg" class="bg-red-50 text-red-700 text-sm p-3 rounded-lg"></div>
          <div x-show="infoMsg" x-text="infoMsg" class="bg-green-50 text-green-700 text-sm p-3 rounded-lg"></div>
          <button type="submit" :disabled="loading" class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 disabled:bg-slate-400">
            <span x-text="loading ? 'Ingresando...' : 'Ingresar'"></span>
          </button>
          <div class="text-center">
            <button type="button" @click="forgotMode = true; errorMsg = ''; infoMsg = ''" class="text-sm text-blue-600 underline">¿Olvidaste tu contraseña?</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- =================== APP PRINCIPAL =================== -->
  <template x-if="ready && session && !showReset">
    <div class="min-h-screen">
      <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
          <div class="flex items-center gap-3">
            <img src="assets/logo.png" alt="" class="h-9" onerror="this.style.display='none'" />
            <div>
              <h1 class="text-lg font-bold text-slate-800">Empodérate Vecino</h1>
              <p class="text-xs text-slate-500" x-text="profile ? ('Rol: ' + profile.app_role + (myCommission ? ' — ' + myCommission.commissions.name : '')) : ''"></p>
            </div>
          </div>
          <button @click="logout" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1 rounded-lg text-sm">Salir</button>
        </div>
      </header>

      <main class="max-w-7xl mx-auto px-4 py-6">

        <div x-show="notice" x-text="notice"
             :class="noticeType === 'ok' ? 'bg-green-50 text-green-700 border-green-300' : 'bg-red-50 text-red-700 border-red-300'"
             class="border p-3 rounded-lg mb-4 text-sm"></div>

        <!-- ============ PANEL RRHH ============ -->
        <template x-if="myRole === 'rrhh'">
          <div>
            <div class="flex gap-2 mb-4 overflow-x-auto pb-1 md:flex-wrap">
              <button @click="view='vol'; pageVol=1" :class="view==='vol' ? 'bg-blue-600 text-white' : 'bg-white'" class="px-4 py-2 rounded-lg text-sm font-medium shadow whitespace-nowrap">Personas</button>
              <button @click="view='bajas'; pageVol=1" :class="view==='bajas' ? 'bg-blue-600 text-white' : 'bg-white'" class="px-4 py-2 rounded-lg text-sm font-medium shadow whitespace-nowrap">Bajas</button>
              <button @click="view='reg'" :class="view==='reg' ? 'bg-blue-600 text-white' : 'bg-white'" class="px-4 py-2 rounded-lg text-sm font-medium shadow whitespace-nowrap">Registrar horas</button>
              <button @click="view='rep'; pageHours=1; $nextTick(() => renderChart())" :class="view==='rep' ? 'bg-blue-600 text-white' : 'bg-white'" class="px-4 py-2 rounded-lg text-sm font-medium shadow whitespace-nowrap">Horas registradas</button>
              <button @click="view='att'; $nextTick(() => loadAttendance())" :class="view==='att' ? 'bg-blue-600 text-white' : 'bg-white'" class="px-4 py-2 rounded-lg text-sm font-medium shadow whitespace-nowrap">Asistencia</button>
              <button @click="view='cert'" :class="view==='cert' ? 'bg-blue-600 text-white' : 'bg-white'" class="px-4 py-2 rounded-lg text-sm font-medium shadow whitespace-nowrap">Constancias</button>
            </div>

            <!-- PERSONAS -->
            <div x-show="view==='vol'">
              <div class="flex flex-wrap gap-2 justify-end mb-3">
                <button @click="exportPeopleXLS()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm">📥 Exportar XLS</button>
                <button @click="newPerson()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm">＋ Nuevo Miembro</button>
              </div>

              <div x-show="showPersonForm" class="bg-white rounded-lg shadow p-4 mb-4 grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
                <h3 class="md:col-span-2 font-bold text-slate-700" x-text="personForm.id ? 'Editar / completar ficha' : 'Alta de persona'"></h3>
                <div><label class="block font-medium text-slate-700 mb-1">Nombres *</label>
                  <input x-model="personForm.nombres" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                <div><label class="block font-medium text-slate-700 mb-1">Apellidos *</label>
                  <input x-model="personForm.apellidos" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                <div><label class="block font-medium text-slate-700 mb-1">Comisión *</label>
                  <select x-model="personForm.commission_id" class="w-full border border-slate-300 rounded-lg p-2">
                    <option value="">-- Selecciona --</option>
                    <template x-for="c in commissions" :key="c.id"><option :value="c.id" x-text="c.name"></option></template>
                  </select></div>
                <div><label class="block font-medium text-slate-700 mb-1">Rol interno</label>
                  <input x-model="personForm.internal_role" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                <div><label class="block font-medium text-slate-700 mb-1">Teléfono</label>
                  <input x-model="personForm.phone" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                <div><label class="block font-medium text-slate-700 mb-1">Correo</label>
                  <input type="email" x-model="personForm.email" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                <div><label class="block font-medium text-slate-700 mb-1">Carrera</label>
                  <input x-model="personForm.career" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                <div><label class="block font-medium text-slate-700 mb-1">Fecha de ingreso</label>
                  <input type="date" x-model="personForm.admission_date" :max="today" class="w-full border border-slate-300 rounded-lg p-2" /></div>

                <!-- UBIGEO -->
                <div class="md:col-span-2">
                  <label class="flex items-center gap-2 mb-2">
                    <input type="checkbox" x-model="personForm.is_foreign" class="w-4 h-4" />
                    <span class="font-medium text-slate-700">Reside en el extranjero</span>
                  </label>
                </div>

                <div x-show="!personForm.is_foreign"><label class="block font-medium text-slate-700 mb-1">Departamento</label>
                  <select x-model="personForm.department_name" @change="onDepartmentChange()" class="w-full border border-slate-300 rounded-lg p-2">
                    <option value="">-- Selecciona --</option>
                    <template x-for="d in ubigeoDepartamentos" :key="d"><option :value="d" x-text="d"></option></template>
                  </select></div>
                <div x-show="!personForm.is_foreign"><label class="block font-medium text-slate-700 mb-1">Provincia</label>
                  <select x-model="personForm.province_name" @change="onProvinceChange()" class="w-full border border-slate-300 rounded-lg p-2">
                    <option value="">-- Selecciona --</option>
                    <template x-for="p in ubigeoProvincias" :key="p"><option :value="p" x-text="p"></option></template>
                  </select></div>
                <div x-show="!personForm.is_foreign"><label class="block font-medium text-slate-700 mb-1">Distrito</label>
                  <select x-model="personForm.district_name" class="w-full border border-slate-300 rounded-lg p-2">
                    <option value="">-- Selecciona --</option>
                    <template x-for="d in ubigeoDistritos" :key="d.id"><option :value="d.distrito" x-text="d.distrito"></option></template>
                  </select></div>

                <div x-show="personForm.is_foreign" class="md:col-span-2"><label class="block font-medium text-slate-700 mb-1">Ciudad / País</label>
                  <input type="text" x-model="personForm.city_foreign" class="w-full border border-slate-300 rounded-lg p-2" placeholder="Ej: Sevilla, España" /></div>

                <div class="md:col-span-2">
                  <label class="block font-medium text-slate-700 mb-1">Foto</label>
                  <div class="flex items-center gap-3">
                    <img x-show="personForm.photo_url" :src="personForm.photo_url" class="h-16 w-16 rounded object-cover" />
                    <input type="file" accept="image/*" @change="uploadPhoto($event.target.files[0])" class="text-sm" />
                  </div>
                </div>

                <template x-if="fullForm">
                  <div class="md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-3 border-t pt-3 mt-1">
                    <h4 class="md:col-span-2 font-semibold text-slate-500 text-xs uppercase">Ficha completa</h4>
                    <div><label class="block font-medium text-slate-700 mb-1">DNI</label><input x-model="personForm.dni" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                    <div><label class="block font-medium text-slate-700 mb-1">Fecha nacimiento</label><input type="date" x-model="personForm.birth_date" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                    <div><label class="block font-medium text-slate-700 mb-1">Nivel de estudios</label><input x-model="personForm.education_level" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                    <div><label class="block font-medium text-slate-700 mb-1">Institución</label><input x-model="personForm.institution" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                    <div><label class="block font-medium text-slate-700 mb-1">¿Trabaja?</label><input x-model="personForm.works" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                    <div><label class="block font-medium text-slate-700 mb-1">Alergias</label><input x-model="personForm.allergies" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                    <div><label class="block font-medium text-slate-700 mb-1">Seguro</label><input x-model="personForm.insurance" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                    <div><label class="block font-medium text-slate-700 mb-1">Contacto emergencia</label><input x-model="personForm.emergency_contact" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                    <div><label class="block font-medium text-slate-700 mb-1">Parentesco</label><input x-model="personForm.emergency_relationship" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                    <div><label class="block font-medium text-slate-700 mb-1">Tel. emergencia</label><input x-model="personForm.emergency_phone" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                    <div><label class="block font-medium text-slate-700 mb-1">Hobbies</label><input x-model="personForm.hobbies" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                    <div><label class="block font-medium text-slate-700 mb-1">Mascotas</label><input x-model="personForm.pets" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                  </div>
                </template>

                <div class="md:col-span-2"><label class="block font-medium text-slate-700 mb-1">Observaciones</label>
                  <input x-model="personForm.notes" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                <div class="md:col-span-2 flex gap-2">
                  <button @click="savePerson()" class="bg-blue-600 text-white px-5 py-2 rounded-lg text-sm">Guardar</button>
                  <button @click="showPersonForm = false" class="bg-slate-200 text-slate-700 px-5 py-2 rounded-lg text-sm">Cancelar</button>
                </div>
              </div>

              <div class="bg-white rounded-lg shadow p-3 mb-3 grid grid-cols-1 md:grid-cols-3 gap-3 text-sm">
                <div><label class="block font-medium text-slate-700 mb-1">Filtrar por comisión</label>
                  <select x-model="filterCommission" @change="pageVol = 1" class="w-full border border-slate-300 rounded-lg p-2">
                    <option value="">-- Todas --</option>
                    <template x-for="c in commissions" :key="c.id"><option :value="c.id" x-text="c.name"></option></template>
                  </select></div>
                <div class="md:col-span-2"><label class="block font-medium text-slate-700 mb-1">Buscar</label>
                  <input type="text" x-model="filterSearch" @input="pageVol = 1" placeholder="Nombre, apellido, correo o DNI..." class="w-full border border-slate-300 rounded-lg p-2" /></div>
                <div class="md:col-span-3 text-xs text-slate-500">Mostrando <span x-text="filteredVols.length"></span> de <span x-text="volunteers.length"></span></div>
              </div>

              <div class="bg-white rounded-lg shadow overflow-x-auto">
                <table class="min-w-full text-sm">
                  <thead class="bg-slate-50 text-left text-slate-600">
                    <tr><th class="p-3">Foto</th><th class="p-3">Voluntario</th><th class="p-3">Comisión</th><th class="p-3">Rol</th><th class="p-3">Estado</th><th class="p-3">Ingreso</th><th class="p-3">Acciones</th></tr>
                  </thead>
                  <tbody>
                    <template x-for="v in pagedVols" :key="v.id">
                      <tr class="border-t">
                        <td class="p-3">
                          <img x-show="v.photo_url" :src="v.photo_url" class="h-8 w-8 rounded-full object-cover" />
                          <span x-show="!v.photo_url" class="text-slate-300">👤</span>
                        </td>
                        <td class="p-3" x-text="fullName(v)"></td>
                        <td class="p-3" x-text="commissionName(v.commission_id)"></td>
                        <td class="p-3" x-text="v.internal_role || ''"></td>
                        <td class="p-3"><span class="px-2 py-1 rounded text-xs"
                          :class="v.status==='activo' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'" x-text="v.status"></span></td>
                        <td class="p-3" x-text="v.admission_date || ''"></td>
                        <td class="p-3">
                          <button @click="editPerson(v)" class="text-blue-600 text-xs underline mr-2">Ficha</button>
                          <button x-show="v.status==='activo'" @click="darBaja(v)" class="text-red-600 text-xs underline mr-2">Baja</button>
                          <button x-show="v.status==='baja'" @click="reactivar(v)" class="text-green-600 text-xs underline">Reactivar</button>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
                <div class="flex items-center justify-end gap-2 p-3 text-sm">
                  <button @click="pageVol = Math.max(1, pageVol - 1)" :disabled="pageVol <= 1" class="px-3 py-1 rounded bg-slate-200 disabled:opacity-40">Anterior</button>
                  <span x-text="pageVol + ' / ' + totalPagesVols + ' · ' + filteredVols.length + ' personas'"></span>
                  <button @click="pageVol = Math.min(totalPagesVols, pageVol + 1)" :disabled="pageVol >= totalPagesVols" class="px-3 py-1 rounded bg-slate-200 disabled:opacity-40">Siguiente</button>
                </div>
              </div>
            </div>

            <!-- BAJAS -->
            <div x-show="view==='bajas'">
              <h2 class="font-bold text-slate-700 mb-3">Personas dadas de baja (<span x-text="bajas.length"></span>)</h2>
              <div class="bg-white rounded-lg shadow overflow-x-auto">
                <table class="min-w-full text-sm">
                  <thead class="bg-slate-50 text-left text-slate-600">
                    <tr><th class="p-3">Voluntario</th><th class="p-3">Comisión</th><th class="p-3">Rol</th><th class="p-3">Fecha baja</th><th class="p-3">Motivo</th><th class="p-3">Acciones</th></tr>
                  </thead>
                  <tbody>
                    <template x-for="v in bajas" :key="v.id">
                      <tr class="border-t">
                        <td class="p-3" x-text="fullName(v)"></td>
                        <td class="p-3" x-text="commissionName(v.commission_id)"></td>
                        <td class="p-3" x-text="v.internal_role || ''"></td>
                        <td class="p-3" x-text="v.departure_date || ''"></td>
                        <td class="p-3" x-text="v.departure_reason || ''"></td>
                        <td class="p-3">
                          <button @click="reactivar(v)" class="text-green-600 text-xs underline mr-2">Reactivar</button>

                      <td class="p-3">
                        <span class="px-2 py-1 rounded text-xs"
                          :class="p.can_write ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-600'"
                          x-text="p.can_write ? 'SÍ' : 'NO'"></span>
                      </td>
                      <td class="p-3">
                        <button @click="toggleSubAccount(p)" class="text-blue-600 text-xs underline"
                          x-text="p.can_write ? 'Revocar' : 'Autorizar'"></button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>

            <!-- ASISTENCIA COORDINADOR -->
            <div x-show="view==='att'">
              <div class="bg-white rounded-lg shadow p-4 mb-4 grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
                <div><label class="block font-medium text-slate-700 mb-1">Desde</label>
                  <input type="date" x-model="attFilter.from" @change="loadAttendance()" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                <div><label class="block font-medium text-slate-700 mb-1">Hasta</label>
                  <input type="date" x-model="attFilter.to" @change="loadAttendance()" class="w-full border border-slate-300 rounded-lg p-2" /></div>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div class="relative bg-white rounded-lg shadow p-4" style="height:280px"><canvas id="chartAtt"></canvas></div>
                <div class="bg-white rounded-lg shadow p-4 text-sm space-y-2">
                  <h3 class="font-bold text-slate-700">Resumen</h3>
                  <p>Total: <strong x-text="attendanceData.length"></strong></p>
                  <p>Asistencias: <strong class="text-green-600" x-text="attendanceData.filter(a=>a.attended).length"></strong></p>
                  <p>Inasistencias: <strong class="text-red-600" x-text="attendanceData.filter(a=>!a.attended).length"></strong></p>
                  <label class="mt-3 block bg-green-600 text-white px-4 py-2 rounded-lg text-sm cursor-pointer hover:bg-green-700 text-center">
                    📤 Importar XLS
                    <input type="file" accept=".xlsx,.xls" @change="importAttFile($event.target.files[0]); $event.target.value=''" class="hidden" />
                  </label>
                  <button @click="downloadAttTemplate()" class="mt-2 w-full bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm">📋 Plantilla</button>
                  <button @click="exportAttXLS()" class="mt-2 w-full bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">📥 Exportar XLS</button>
                </div>
              </div>
              <div class="bg-white rounded-lg shadow overflow-x-auto">
                <table class="min-w-full text-sm">
                  <thead class="bg-slate-50 text-left text-slate-600">
                    <tr><th class="p-3">Fecha</th><th class="p-3">Voluntario</th><th class="p-3">Actividad</th><th class="p-3">Estado</th><th class="p-3">Justificación</th></tr>
                  </thead>
                  <tbody>
                    <template x-for="a in attendanceData" :key="a.id">
                      <tr class="border-t">
                        <td class="p-3" x-text="a.meeting_date"></td>
                        <td class="p-3" x-text="fullName(a.people)"></td>
                        <td class="p-3" x-text="a.activities ? a.activities.name : ''"></td>
                        <td class="p-3">
                          <span class="px-2 py-1 rounded text-xs"
                            :class="a.attended ? 'bg-green-100 text-green-700' : (a.justified ? 'bg-amber-100 text-amber-700' : 'bg-red-100 text-red-700')"
                            x-text="a.attended ? 'Asistió' : (a.justified ? 'Justificada' : 'Inasistencia')"></span>
                        </td>
                        <td class="p-3" x-text="a.justification || '—'"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>

            <!-- REPORTE COORDINADOR -->
            <div x-show="view==='rep'">
              <div class="bg-white rounded-lg shadow p-4 mb-4 grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
                <div><label class="block font-medium text-slate-700 mb-1">Desde</label>
                  <input type="date" x-model="hourFilter.from" @change="pageHours = 1; $nextTick(() => renderChart())" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                <div><label class="block font-medium text-slate-700 mb-1">Hasta</label>
                  <input type="date" x-model="hourFilter.to" @change="pageHours = 1; $nextTick(() => renderChart())" class="w-full border border-slate-300 rounded-lg p-2" /></div>
              </div>

              <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold text-slate-700">Total: <span x-text="totalHours(filteredHours)"></span> h</h2>
                <div class="flex flex-wrap gap-2">
                  <label class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm cursor-pointer hover:bg-green-700">
                    📤 Importar XLS
                    <input type="file" accept=".xlsx,.xls" @change="importHoursFile($event.target.files[0]); $event.target.value=''" class="hidden" />
                  </label>
                  <button @click="downloadHoursTemplate()" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm">📋 Plantilla</button>
                  <button @click="exportXLS" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">📥 Exportar XLS</button>
                </div>
              </div>

              <div class="flex gap-2 mb-2">
                <button @click="chartMode='comision'; $nextTick(() => renderChart())"
                  :class="chartMode==='comision' ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-700'"
                  class="px-3 py-1 rounded-lg text-xs font-medium">Por Comisión</button>
                <button @click="chartMode='actividad'; $nextTick(() => renderChart())"
                  :class="chartMode==='actividad' ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-700'"
                  class="px-3 py-1 rounded-lg text-xs font-medium">Por Actividad</button>
              </div>
              <div class="relative bg-white rounded-lg shadow p-4 mb-4" style="height:320px"><canvas id="chartHours"></canvas></div>

              <div class="bg-white rounded-lg shadow overflow-x-auto">
                <table class="min-w-full text-sm">
                  <thead class="bg-slate-50 text-left text-slate-600">
                    <tr><th class="p-3">Fecha</th><th class="p-3">Voluntario</th><th class="p-3">Actividad</th><th class="p-3">Horas</th><th class="p-3">Estado</th><th class="p-3">Acciones</th></tr>
                  </thead>
                  <tbody>
                    <template x-for="h in hours" :key="h.id">
                      <tr class="border-t">
                        <td class="p-3"><template x-if="hourEdit===h.id"><input type="date" x-model="hourForm.entry_date" :max="today" class="border p-1 rounded text-xs" /></template><span x-show="hourEdit!==h.id" x-text="h.entry_date"></span></td>
                        <td class="p-3" x-text="fullName(h.people)"></td>
                        <td class="p-3">
                          <template x-if="hourEdit===h.id">
                            <select x-model="hourForm.activity_id" class="border p-1 rounded text-xs">
                              <template x-for="a in activities" :key="a.id"><option :value="a.id" x-text="a.name"></option></template>
                            </select>
                          </template>
                          <span x-show="hourEdit!==h.id" x-text="h.activities ? h.activities.name : ''"></span>
                        </td>
                        <td class="p-3"><template x-if="hourEdit===h.id"><input type="number" step="0.25" min="0.25" max="24" x-model="hourForm.hours" class="border p-1 rounded w-16 text-xs" /></template><span x-show="hourEdit!==h.id" x-text="h.hours"></span></td>
                        <td class="p-3" x-text="h.status"></td>
                        <td class="p-3">
                          <div x-show="hourEdit!==h.id" class="flex gap-2">
                            <button @click="openHourEdit(h)" class="text-blue-600 text-xs underline">Editar</button>
                            <button @click="deleteHour(h)" class="text-red-600 text-xs underline">Eliminar</button>
                          </div>
                          <div x-show="hourEdit===h.id" class="flex gap-2">
                            <button @click="saveHourEdit()" class="text-green-600 text-xs underline">Guardar</button>
                            <button @click="hourEdit = null" class="text-slate-600 text-xs underline">Cancelar</button>
                          </div>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </template>

        <!-- ============ PANEL DIRECCIÓN ============ -->
        <template x-if="myRole === 'direccion'">
          <div>
            <div class="flex gap-2 mb-4 overflow-x-auto pb-1 md:flex-wrap">
              <button @click="view='rep'" :class="view==='rep' ? 'bg-blue-600 text-white' : 'bg-white'" class="px-4 py-2 rounded-lg text-sm font-medium shadow whitespace-nowrap">Horas</button>
              <button @click="view='att'; $nextTick(() => loadAttendance())" :class="view==='att' ? 'bg-blue-600 text-white' : 'bg-white'" class="px-4 py-2 rounded-lg text-sm font-medium shadow whitespace-nowrap">Asistencia</button>
            </div>
             <div x-show="view==='rep'">
              <div class="bg-white rounded-lg shadow p-4 mb-4 grid grid-cols-1 md:grid-cols-3 gap-3 text-sm">
                <div><label class="block font-medium text-slate-700 mb-1">Comisión</label>
                  <select x-model="hourFilter.commission_id" @change="$nextTick(() => renderChart())" class="w-full border border-slate-300 rounded-lg p-2">
                    <option value="">-- Todas --</option>
                    <template x-for="c in commissions" :key="c.id"><option :value="c.id" x-text="c.name"></option></template>
                  </select></div>
                <div><label class="block font-medium text-slate-700 mb-1">Desde</label>
                  <input type="date" x-model="hourFilter.from" @change="$nextTick(() => renderChart())" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                <div><label class="block font-medium text-slate-700 mb-1">Hasta</label>
                  <input type="date" x-model="hourFilter.to" @change="$nextTick(() => renderChart())" class="w-full border border-slate-300 rounded-lg p-2" /></div>
              </div>

              <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold text-slate-700">Total ONG: <span x-text="totalHours(filteredHours)"></span> h</h2>
                <button @click="exportXLS" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">Exportar XLS</button>
              </div>
              <div class="flex gap-2 mb-2">
                <button @click="chartMode='comision'; $nextTick(() => renderChart())"
                  :class="chartMode==='comision' ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-700'"
                  class="px-3 py-1 rounded-lg text-xs font-medium">Por Comisión</button>
                <button @click="chartMode='actividad'; $nextTick(() => renderChart())"
                  :class="chartMode==='actividad' ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-700'"
                  class="px-3 py-1 rounded-lg text-xs font-medium">Por Actividad</button>
              </div>
              <div class="relative bg-white rounded-lg shadow p-4 mb-4" style="height:320px"><canvas id="chartHours"></canvas></div>

              <div class="bg-white rounded-lg shadow overflow-x-auto">
                <table class="min-w-full text-sm">
                  <thead class="bg-slate-50 text-left text-slate-600">
                    <tr><th class="p-3">Fecha</th><th class="p-3">Voluntario</th><th class="p-3">Comisión</th><th class="p-3">Actividad</th><th class="p-3">Horas</th></tr>
                  </thead>
                  <tbody>
                    <template x-for="h in hours" :key="h.id">
                      <tr class="border-t">
                        <td class="p-3" x-text="h.entry_date"></td>
                        <td class="p-3" x-text="fullName(h.people)"></td>
                        <td class="p-3" x-text="commissionName(h.commission_id)"></td>
                        <td class="p-3" x-text="h.activities ? h.activities.name : ''"></td>
                        <td class="p-3" x-text="h.hours"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
            <div x-show="view==='att'">
              <div class="bg-white rounded-lg shadow p-4 mb-4 grid grid-cols-1 md:grid-cols-3 gap-3 text-sm">
                <div><label class="block font-medium text-slate-700 mb-1">Comisión</label>
                  <select x-model="attFilter.commission_id" @change="loadAttendance()" class="w-full border border-slate-300 rounded-lg p-2">
                    <option value="">-- Todas --</option>
                    <template x-for="c in commissions" :key="c.id"><option :value="c.id" x-text="c.name"></option></template>
                  </select></div>
                <div><label class="block font-medium text-slate-700 mb-1">Desde</label>
                  <input type="date" x-model="attFilter.from" @change="loadAttendance()" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                <div><label class="block font-medium text-slate-700 mb-1">Hasta</label>
                  <input type="date" x-model="attFilter.to" @change="loadAttendance()" class="w-full border border-slate-300 rounded-lg p-2" /></div>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="relative bg-white rounded-lg shadow p-4" style="height:280px"><canvas id="chartAtt"></canvas></div>
                <div class="bg-white rounded-lg shadow p-4 text-sm space-y-2">
                  <h3 class="font-bold text-slate-700">Resumen global</h3>
                  <p>Total: <strong x-text="attendanceData.length"></strong></p>
                  <p>Asistencias: <strong class="text-green-600" x-text="attendanceData.filter(a=>a.attended).length"></strong></p>
                  <p>Inasistencias: <strong class="text-red-600" x-text="attendanceData.filter(a=>!a.attended).length"></strong></p>
                  <button @click="exportAttXLS()" class="mt-3 w-full bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">📥 Exportar XLS</button>
                </div>
              </div>
            </div>
          </div>
        </template>

        <!-- ============ PANEL TECNOLOGÍA ============ -->
        <template x-if="myRole === 'tecnologia' && !isCoordView">
          <div>
            <h2 class="text-xl font-bold text-slate-800 mb-4">Panel Tecnología</h2>
            <div class="bg-white p-4 rounded-lg shadow"><p class="text-slate-600 text-sm">Acceso técnico del sistema.</p></div>
          </div>
        </template>

      </main>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    (function () {
      var problemas = [];
      if (!window.supabase) problemas.push('No se cargó la librería Supabase.');
      if (typeof window.app !== 'function') problemas.push('app.js no se ejecutó.');
      if (problemas.length) {
        var d = document.getElementById('boot-detail');
        if (d) { d.textContent = problemas.join(' '); d.style.color = '#b91c1c'; }
      }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</body>
</html>
